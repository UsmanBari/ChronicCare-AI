name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy-and-smoke-test:
    name: Deploy & Smoke Test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Trigger Render Backend Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not configured; skipping automated deploy trigger."
          else
            echo "Triggering Render deployment..."
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Post-Deployment Smoke Test
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Repository variable BACKEND_URL is not set."
            exit 1
          fi
          if [ -z "$FRONTEND_URL" ]; then
            echo "::error::Repository variable FRONTEND_URL is not set."
            exit 1
          fi
          python scripts/smoke_test.py --backend "$BACKEND_URL" --frontend "$FRONTEND_URL" --wait 600
